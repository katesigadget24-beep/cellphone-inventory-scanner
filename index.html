<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cell Phone Inventory</title>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,Roboto,sans-serif;background:#f1f4f9;color:#111;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:auto;padding:14px}h1{font-size:22px;margin:6px 0 2px}small{color:#666}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.modes button{padding:12px 4px;border:0;border-radius:12px;background:#e3e6ec;font-weight:700;font-size:13px}
.modes button.on{background:#1976d2;color:#fff}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0001}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid #c9ced8;border-radius:10px;font-size:16px;background:#fff}
input[readonly]{background:#eef1f6}.row{display:flex;gap:8px}.row>*:first-child{flex:1}
.btn{padding:13px;border:0;border-radius:12px;font-weight:700;font-size:16px;background:#1976d2;color:#fff;width:100%;margin-top:12px}
.btn.sm{width:auto;margin:0;padding:0 14px}.btn.gray{background:#666}
.badge{display:inline-block;padding:4px 10px;border-radius:99px;font-weight:700;font-size:13px;color:#fff}
.ok{background:#2e7d32}.bad{background:#c62828}.warn{background:#ef6c00}
#toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));padding:14px;border-radius:12px;color:#fff;font-weight:700;display:none;z-index:9}
#scan{position:fixed;inset:0;background:#000d;display:none;z-index:8;padding:20px;flex-direction:column;justify-content:center;gap:12px}
#selfie{position:fixed;inset:0;background:#000e;display:none;z-index:10;padding:20px;flex-direction:column;justify-content:center;gap:12px}
#sv{width:100%;max-height:60vh;object-fit:cover;border-radius:12px;background:#000;transform:scaleX(-1)}
#zoomBox{display:none;align-items:center;gap:10px;color:#fff;font-weight:700}#zoomBox input{flex:1;padding:0}#zoomBox button{width:46px;height:46px;border:0;border-radius:50%;background:#1976d2;color:#fff;font-size:24px;font-weight:700}
#reader{background:#000;border-radius:12px;overflow:hidden}dialog{border:0;border-radius:14px;width:92%;max-width:420px}
</style></head><body><main>
<div class="row" style="align-items:center"><div><h1>📱 Cell Phone Inventory</h1><small id="who"></small></div><button class="btn sm gray" onclick="cfgDlg.showModal()">Log in</button></div>
<div class="modes" id="modes"></div>
<div class="card">
  <label>IMEI 1 <span id="hint" style="font-weight:400;color:#666"></span></label>
  <div class="row"><input id="imei1" inputmode="numeric" placeholder="15-digit IMEI" maxlength="15"><button class="btn sm" onclick="scanInto('imei1','imei')">📷</button></div>
  <div id="newIds">
    <label>IMEI 2 (optional)</label><div class="row"><input id="imei2" inputmode="numeric" maxlength="15"><button class="btn sm" onclick="scanInto('imei2','imei')">📷</button></div>
  </div>
  <button class="btn" id="searchBtn" onclick="lookup()">🔎 SEARCH UNIT</button>
</div>
<div class="card" id="result" style="display:none"></div>
<div class="card" id="formCard" style="display:none"><div id="unitPick"></div><div id="fields"></div><button class="btn" id="saveBtn" onclick="save()">💾 SAVE TO GOOGLE SHEET</button></div>
</main>
<div id="scan"><div id="reader"></div><div id="zoomBox"><button onclick="stepZoom(-1)">−</button><input id="zoom" type="range" oninput="setZoom(this.value)"><button onclick="stepZoom(1)">+</button><span id="zoomVal" style="min-width:42px"></span></div><div style="color:#fff;text-align:center" id="scanMsg">Point at the barcode on the box</div><button class="btn gray" onclick="stopScan()">✖ CLOSE</button></div>
<div id="selfie"><video id="sv" autoplay playsinline muted></video><div style="color:#fff;text-align:center">Look at the camera to log your photo</div><button class="btn" id="snapBtn">📸 TAKE PHOTO &amp; SAVE</button><button class="btn gray" id="snapCancel">✖ CANCEL</button></div>
<div id="toast"></div>
<dialog id="cfgDlg"><h3>Encoder Log in</h3>
<label>Passcode</label><input id="cPass" type="password"><label>Your name (encoder)</label><input id="cEnc">
<button class="btn" onclick="saveCfg()">LOG IN</button></dialog>

<script>
// Paste your Apps Script Web App URL here (it is not asked for on the Log in screen).
const DEFAULT_URL = 'https://script.google.com/macros/s/AKfycbzMTwBU_1xjNGguW08HPXjdrdmDrYTodXRsMooh_zyBHsiEzPPn4Z6_7k5bdIkwK6S-/exec';
const MODES = {NEW:'📦 NEW STOCK',SOLD:'💰 SOLD',TRANSFER:'🔄 TRANSFER',DEFECTIVE:'⚠️ DEFECTIVE',BUYBACK:'↩️ BUYBACK',CHECK:'🔎 CHECK'};
const RULES = {SOLD:['IN STOCK'],TRANSFER:['IN STOCK'],DEFECTIVE:['IN STOCK','SOLD','BUYBACK'],BUYBACK:['SOLD']};
// [key, label, type, source]  type: text|number|date|select|ro
const F = {
 NEW:[['date_purchase','Date Purchase','date'],['date_received','Date Received','date'],['supplier','Supplier','text','suppliers'],['cost','Cost Price','number'],['price','Selling Price','number'],['branch','Branch','select','branches']],
 SOLD:[['date','Date Sold','date'],['si','SI No.','text'],['branch','Branch','select','branches'],['price','Cellphone Selling Price','number'],['bundle','Bundle Amount','number'],['inclusions','Bundle Inclusions','text'],['total','Total Sales Amount','ro'],['customer','Customer','text'],['paymode','Payment Mode','select','paymodes'],['financing','Financing Company','select','financing'],['down','Down Payment','number'],['received','Amount Received','number'],['balance','Balance','ro'],['paystatus','Payment Status','select','paystatus'],['remarks','Remarks','text']],
 TRANSFER:[['date','Date Transfer','date'],['from','From Branch','ro'],['to','To Branch','select','branches'],['remarks','Remarks','text']],
 DEFECTIVE:[['date','Date Defective','date'],['branch','Branch','select','branches'],['reason','Defective Reason','text'],['remarks','Remarks','text']],
 BUYBACK:[['date','Date Buyback','date'],['branch','Branch','select','branches'],['from','Buyback From','text'],['amount','Buyback Amount','number'],['paymode','Mode of Payment','select','paymodes'],['reason','Reason','text'],['remarks','Remarks','text']]
};
const $ = id => document.getElementById(id);
let cfg = {}, mode = 'CHECK', unit = null, picked = '';
const conf = () => ({url: DEFAULT_URL, pass: localStorage.pass || '', enc: localStorage.enc || ''});
const today = () => {const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10)};
function toast(m, good=true){const t=$('toast');t.textContent=m;t.style.background=good?'#2e7d32':'#c62828';t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',3500)}
const luhn = s => {let t=0;for(let i=0;i<15;i++){let d=+s[14-i];if(i%2){d*=2;if(d>9)d-=9}t+=d}return t%10===0};

async function api(action, body, q){
  const c = conf(); if(!c.url){throw Error('Web App URL is not set in index.html (DEFAULT_URL)')}
  const r = body ? await fetch(c.url,{method:'POST',body:JSON.stringify({...body,action,pass:c.pass})})
                 : await fetch(c.url+'?'+new URLSearchParams({action,pass:c.pass,...q}));
  const j = await r.json(); if(!j.ok) throw Error(j.msg||'Error'); return j;
}
function saveCfg(){localStorage.pass=$('cPass').value;localStorage.enc=$('cEnc').value.trim();cfgDlg.close();init()}

async function init(){
  const c = conf(); $('cPass').value=c.pass;$('cEnc').value=c.enc;$('who').textContent=c.enc?'Encoder: '+c.enc:'Cell Phone Inventory Scanner';
  $('modes').innerHTML = Object.keys(MODES).map(m=>`<button data-m="${m}" onclick="setMode('${m}')">${MODES[m]}</button>`).join('');
  setMode(mode);
  try{cfg = await api('setup')}catch(e){toast(e.message,false)}
}
function setMode(m){
  mode=m;unit=null;picked='';
  document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('newIds').style.display = m==='NEW'?'block':'none';
  $('searchBtn').style.display = m==='NEW'?'none':'block';
  $('hint').textContent = m==='CHECK'?'(scan or type to check availability)':'';
  $('result').style.display='none';$('formCard').style.display='none';
  if(m==='NEW') buildForm();
}
function opts(a){return '<option value=""></option>'+(a||[]).map(x=>`<option>${x}</option>`).join('')}
function buildForm(){
  $('formCard').style.display='block';
  $('unitPick').innerHTML = mode==='NEW' ? `<label>Model</label><select id="pm" onchange="pickModel()">${opts([...new Set((cfg.units||[]).map(u=>u.m))])}</select>
    <label>Storage</label><select id="ps" onchange="pickStorage()"></select><label>Color</label><select id="pc" onchange="pickColor()"></select>
    <div id="pd" style="margin-top:8px;font-weight:700"></div>` : '';
  $('fields').innerHTML = '<datalist id="dl">'+(cfg.suppliers||[]).map(s=>`<option>${s}</option>`).join('')+'</datalist>' +
    F[mode].map(([k,l,t,src])=>`<label>${l}</label>`+(t==='select'?`<select id="f_${k}">${opts(cfg[src])}</select>`
      :`<input id="f_${k}" ${t==='ro'?'readonly':''} ${t==='number'?'inputmode="decimal"':''} ${t==='date'?'type="date"':''} ${src?'list="dl"':''} oninput="calc()">`)).join('');
  ['f_date','f_date_purchase','f_date_received'].forEach(i=>{if($(i))$(i).value=today()});
  if(unit) fillFromUnit();
}
function pickModel(){const m=$('pm').value;$('ps').innerHTML=opts([...new Set(cfg.units.filter(u=>u.m===m).map(u=>u.s))]);$('pc').innerHTML='';picked='';$('pd').textContent=''}
function pickStorage(){const m=$('pm').value,s=$('ps').value;$('pc').innerHTML=opts(cfg.units.filter(u=>u.m===m&&u.s===s).map(u=>u.c));picked=''}
function pickColor(){
  const u=cfg.units.find(u=>u.m===$('pm').value&&u.s===$('ps').value&&u.c===$('pc').value);if(!u)return;
  picked=u.d;$('pd').textContent=u.d;const p=cfg.prices[u.d];
  if(p){$('f_cost').value=p.cost;$('f_price').value=p.price;if(p.supplier)$('f_supplier').value=p.supplier}
}
function calc(){
  if(mode!=='SOLD')return;const v=k=>+($('f_'+k).value)||0;
  $('f_total').value=v('price')+v('bundle');$('f_balance').value=v('price')+v('bundle')-v('received');
}
function fillFromUnit(){
  const set=(k,v)=>{if($('f_'+k)&&v!==undefined&&v!=='')$('f_'+k).value=v};
  set('branch',unit.branch);set('from',unit.branch);set('price',unit.price);calc();
}

async function lookup(){
  const v=$('imei1').value.trim();if(!v)return toast('Enter or scan an IMEI',false);
  try{
    unit=(await api('lookup',null,{imei:v})).unit;
    const r=$('result');r.style.display='block';$('formCard').style.display='none';
    if(!unit){r.innerHTML='<span class="badge bad">❌ NOT FOUND IN INVENTORY</span>';return}
    const avail=unit.status==='IN STOCK';
    r.innerHTML=`<span class="badge ${avail?'ok':'bad'}">${avail?'✅ AVAILABLE':'⛔ '+unit.status}</span>
      <p style="margin:10px 0 0"><b>${unit.unit}</b><br>IMEI 1: ${unit.imei1}<br>IMEI 2: ${unit.imei2||'-'}<br>Branch: ${unit.branch}<br>Selling Price: ₱${Number(unit.price||0).toLocaleString()}</p>`;
    if(mode==='CHECK')return;
    if(!RULES[mode].includes(unit.status)){r.innerHTML+=`<p style="color:#c62828;font-weight:700">Cannot ${mode} — status must be ${RULES[mode].join(' / ')}.</p>`;return}
    buildForm();
  }catch(e){toast(e.message,false)}
}

async function save(){
  const body={mode,encoder:conf().enc,imei1:$('imei1').value.trim()};
  if(mode==='NEW'){
    if(!/^\d{15}$/.test(body.imei1)||!luhn(body.imei1)) return toast('IMEI 1 is not a valid 15-digit IMEI',false);
    body.imei2=$('imei2').value.trim();body.unit=picked;
  }
  F[mode].forEach(([k])=>body[k]=$('f_'+k).value);
  try{body.photo=await captureFace()}catch(e){return toast(e.message,false)}
  $('saveBtn').disabled=true;
  try{
    const r=await api('save',body);toast('✅ '+r.msg);
    ['imei1','imei2'].forEach(i=>$(i).value='');setMode(mode);
  }catch(e){toast(e.message,false)}
  $('saveBtn').disabled=false;
}

// ---------- encoder face photo ----------
async function captureFace(){
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:false})}
  catch(e){throw Error('Camera blocked — allow camera access to take your photo')}
  const v=$('sv');v.srcObject=stream;$('selfie').style.display='flex';
  return new Promise((resolve,reject)=>{
    const done=(fn,val)=>{stream.getTracks().forEach(t=>t.stop());v.srcObject=null;$('selfie').style.display='none';fn(val)};
    $('snapBtn').onclick=()=>{
      const w=v.videoWidth,h=v.videoHeight;if(!w)return;
      const k=Math.min(1,480/w),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      done(resolve,c.toDataURL('image/jpeg',0.7));
    };
    $('snapCancel').onclick=()=>done(reject,Error('Photo cancelled — not saved'));
  });
}

// ---------- camera scanner ----------
let qr=null,target=null;
async function scanInto(id,kind){
  target={id,kind};$('scan').style.display='flex';$('scanMsg').textContent='Point at the IMEI barcode on the box';
  qr=new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.ITF],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
  try{
    await qr.start({facingMode:'environment'},{fps:12,qrbox:(w,h)=>({width:Math.floor(w*0.92),height:Math.floor(Math.min(h*0.5,170))}),videoConstraints:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080},focusMode:'continuous'}},onScan,()=>{});
    setupZoom();
  }catch(e){stopScan();toast('Camera blocked — allow camera access in Safari settings',false)}
}
let zf=null;
function setupZoom(){
  $('zoomBox').style.display='none';zf=null;
  try{
    const z=qr.getRunningTrackCameraCapabilities().zoomFeature();
    if(!z.isSupported()){$('scanMsg').textContent+=' (zoom not supported here — hold the phone 15–20 cm from the barcode)';return}
    zf=z;const s=$('zoom');s.min=z.min();s.max=z.max();s.step=z.step()||0.1;
    $('zoomBox').style.display='flex';
    setZoom(Math.min(z.max(),Math.max(z.min(),2)));   // start at 2x
  }catch(e){}
}
function setZoom(v){
  if(!zf)return;v=+v;$('zoom').value=v;$('zoomVal').textContent=v.toFixed(1)+'x';
  try{Promise.resolve(zf.apply(v)).catch(()=>{})}catch(e){}
}
function stepZoom(d){const s=$('zoom');setZoom(Math.min(+s.max,Math.max(+s.min,+s.value+d*Math.max(+s.step,0.5))))}
function onScan(text){
  let v=text.trim();
  if(target.kind==='imei'){v=v.replace(/\D/g,'');if(v.length!==15||!luhn(v)){$('scanMsg').textContent='Not an IMEI ('+text.slice(0,18)+') — keep scanning';return}}
  const id=target.id;stopScan();$(id).value=v;if(navigator.vibrate)navigator.vibrate(80);
  if(id==='imei1'&&mode!=='NEW')lookup();
}
async function stopScan(){
  $('scan').style.display='none';$('zoomBox').style.display='none';zf=null;
  if(qr){try{await qr.stop()}catch(e){}try{qr.clear()}catch(e){}qr=null}
}
$('imei1').addEventListener('input',e=>{if(e.target.value.length===15&&mode!=='NEW')lookup()});
init();
</script></body></html>
