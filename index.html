<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cell Phone Inventory</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 24px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 20px;
    }

    .mode-title {
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mode-btn {
      padding: 14px 8px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #e5e7eb;
      color: #333;
    }

    .mode-btn.active {
      background: #1976d2;
      color: white;
    }

    #reader {
      width: 100%;
      margin: 15px auto;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #startBtn {
      background: #1976d2;
      color: white;
    }

    #stopBtn {
      background: #666;
      color: white;
    }

    .selected-mode {
      margin-top: 15px;
      padding: 12px;
      background: #eef5ff;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #e8f1ff;
      border-radius: 10px;
      font-size: 18px;
      word-break: break-all;
    }

    .success {
      color: #16803c;
      font-weight: bold;
    }

    .error {
      color: #d32f2f;
      font-weight: bold;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>📱 Cell Phone Inventory</h1>

  <div class="subtitle">
    Cell Phone Inventory Scanner
  </div>


  <div class="mode-title">
    What do you want to do?
  </div>


  <div class="mode-buttons">

    <button
      class="mode-btn active"
      id="newStockBtn"
      onclick="selectMode('NEW STOCK')">
      📦 NEW STOCK
    </button>

    <button
      class="mode-btn"
      id="soldBtn"
      onclick="selectMode('SOLD')">
      💰 SOLD
    </button>

    <button
      class="mode-btn"
      id="transferBtn"
      onclick="selectMode('TRANSFER')">
      🔄 TRANSFER
    </button>

    <button
      class="mode-btn"
      id="defectiveBtn"
      onclick="selectMode('DEFECTIVE')">
      ⚠️ DEFECTIVE
    </button>

  </div>


  <div class="selected-mode">
    Selected: <span id="selectedMode">NEW STOCK</span>
  </div>


  <button
    id="startBtn"
    onclick="startScanner()">
    📷 START CAMERA SCANNER
  </button>


  <button
    id="stopBtn"
    onclick="stopScanner()">
    ⏹ STOP SCANNER
  </button>


  <div id="reader"></div>


  <div class="result">

    <strong>Scanned Code:</strong>

    <div id="scannedCode">
      None
    </div>

  </div>


  <div id="message"></div>

</div>


<script>

  let scanner = null;

  let scanning = false;

  let scannedIMEIs = [];

  let currentMode = "NEW STOCK";


  // =========================
  // SELECT MODE
  // =========================

  function selectMode(mode) {

    currentMode = mode;

    // Reset previous scan
    scannedIMEIs = [];

    document.getElementById("scannedCode").innerHTML = "None";

    document.getElementById("message").innerHTML = "";


    document.getElementById("selectedMode").textContent = mode;


    // Remove active state
    document
      .querySelectorAll(".mode-btn")
      .forEach(function(button) {
        button.classList.remove("active");
      });


    // Add active state
    if (mode === "NEW STOCK") {

      document
        .getElementById("newStockBtn")
        .classList.add("active");

    }

    if (mode === "SOLD") {

      document
        .getElementById("soldBtn")
        .classList.add("active");

    }

    if (mode === "TRANSFER") {

      document
        .getElementById("transferBtn")
        .classList.add("active");

    }

    if (mode === "DEFECTIVE") {

      document
        .getElementById("defectiveBtn")
        .classList.add("active");

    }

  }


  // =========================
  // START SCANNER
  // =========================

  async function startScanner() {

    // Reset previous scan
    scannedIMEIs = [];

    document.getElementById("scannedCode").innerHTML = "None";

    document.getElementById("message").innerHTML = "";


    try {

      // Clear old scanner
      document.getElementById("reader").innerHTML = "";


      scanner = new Html5Qrcode("reader", {

        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128
        ]

      });


      const cameras =
        await Html5Qrcode.getCameras();


      if (!cameras || cameras.length === 0) {

        document.getElementById("message").innerHTML =
          '<p class="error">❌ No camera found.</p>';

        return;

      }


      let cameraId = cameras[0].id;


      // Try to select rear camera
      for (
        let i = 0;
        i < cameras.length;
        i++
      ) {

        const label =
          (cameras[i].label || "").toLowerCase();


        if (
          label.includes("back") ||
          label.includes("rear") ||
          label.includes("environment")
        ) {

          cameraId = cameras[i].id;

          break;

        }

      }


      const config = {

        fps: 10,

        qrbox: {
          width: 300,
          height: 150
        }

      };


      await scanner.start(

        cameraId,

        config,

        onScanSuccess,

        onScanError

      );


      scanning = true;


      document.getElementById("message").innerHTML =
        '<p class="success">📷 Camera is active. Scan the barcode.</p>';

    }


    catch (error) {

      console.error(error);


      document.getElementById("message").innerHTML =
        '<p class="error">❌ Camera error: ' +
        error.name +
        ': ' +
        error.message +
        '</p>';

    }

  }


    // =========================
  // SCAN SUCCESS
  // =========================

  function onScanSuccess(decodedText, decodedResult) {

    const code = String(decodedText).trim();

    // IMEI must be exactly 15 digits
    if (!/^\d{15}$/.test(code)) {

      document.getElementById("message").innerHTML =
        '<p class="error">⚠️ Not an IMEI.</p>';

      return;
    }

    // Prevent duplicate
    if (scannedIMEIs.includes(code)) {
      return;
    }

    scannedIMEIs.push(code);


    // =========================
    // NEW STOCK
    // =========================

    if (currentMode === "NEW STOCK") {

      if (scannedIMEIs.length === 1) {

        document.getElementById("scannedCode").innerHTML =
          "<strong>IMEI 1:</strong> " +
          scannedIMEIs[0];

        document.getElementById("message").innerHTML =
          '<p class="success">✅ IMEI 1 scanned! Now scan IMEI 2.</p>';

      }

      else if (scannedIMEIs.length === 2) {

        document.getElementById("scannedCode").innerHTML =

          "<strong>IMEI 1:</strong> " +
          scannedIMEIs[0] +

          "<br><strong>IMEI 2:</strong> " +
          scannedIMEIs[1];

        document.getElementById("message").innerHTML =
          '<p class="success">✅ BOTH IMEIs scanned successfully!<br>🔍 Checking Google Sheets...</p>';

        stopScanner();

        showNewStockForm();

      }

    }


    // =========================
    // SOLD / TRANSFER / DEFECTIVE
    // =========================

    else {

      document.getElementById("scannedCode").innerHTML =
        "<strong>IMEI:</strong> " +
        scannedIMEIs[0];

      document.getElementById("message").innerHTML =
        '<p class="success">✅ IMEI scanned for ' +
        currentMode +
        '.<br>🔍 Checking Google Sheets...</p>';

      stopScanner();

      searchGoogleSheet(scannedIMEIs[0]);

    }

  }


  // =========================
  // SCAN ERROR
  // =========================

  function onScanError(errorMessage) {

    // Ignore normal scanning errors

  }


  // =========================
// SEARCH GOOGLE SHEETS
// =========================

function searchGoogleSheet(imei) {

  const appsScriptUrl =
    "https://script.google.com/macros/s/AKfycbylq5dZebjqqWlyUtLdtxuo6068nc3K-qjS_MoiJAggvUZ_WIqsFloMMOZvN7KrNAEF/exec";

  const callbackName = "inventoryCallback";

  let finished = false;

  document.getElementById("message").innerHTML =
    '<p class="success">🔍 Checking Google Sheets...</p>';

  window[callbackName] = function(result) {

    finished = true;

    console.log("Google Sheets result:", result);

    if (result.found) {

      document.getElementById("message").innerHTML =
        '<p class="success">✅ PHONE FOUND IN INVENTORY!</p>';

      document.getElementById("scannedCode").innerHTML =

        "<strong>IMEI 1:</strong> " +
        (result.imei1 || "") +

        "<br><strong>IMEI 2:</strong> " +
        (result.imei2 || "") +

        "<br><strong>Serial:</strong> " +
        (result.serial || "") +

        "<br><strong>Product ID:</strong> " +
        (result.productId || "") +

        "<br><strong>Brand:</strong> " +
        (result.brand || "") +

        "<br><strong>Model:</strong> " +
        (result.model || "") +

        "<br><strong>Storage:</strong> " +
        (result.storage || "") +

        "<br><strong>Color:</strong> " +
        (result.color || "") +

        "<br><strong>Branch:</strong> " +
        (result.branch || "") +

        "<br><strong>Status:</strong> " +
        (result.status || "") +

        "<br><strong>Date Received:</strong> " +
        (result.dateReceived || "");

    } else {

      document.getElementById("message").innerHTML =
        '<p class="error">❌ IMEI NOT FOUND IN INVENTORY.</p>';

    }

    delete window[callbackName];

    const oldScript =
      document.getElementById("inventoryApiScript");

    if (oldScript) {
      oldScript.remove();
    }
  };


  const oldScript =
    document.getElementById("inventoryApiScript");

  if (oldScript) {
    oldScript.remove();
  }


  const script =
    document.createElement("script");

  script.id = "inventoryApiScript";

  script.src =
    appsScriptUrl +
    "?api=search" +
    "&imei=" +
    encodeURIComponent(imei) +
    "&callback=" +
    callbackName;

  script.onerror = function() {

    if (finished) return;

    finished = true;

    document.getElementById("message").innerHTML =
      '<p class="error">❌ Cannot connect to Google Sheets.</p>';

    delete window[callbackName];

    script.remove();
  };

  document.head.appendChild(script);


  setTimeout(function() {

    if (finished) return;

    finished = true;

    document.getElementById("message").innerHTML =
      '<p class="error">⚠️ Google Sheets did not respond. Please try again.</p>';

    delete window[callbackName];

    const oldScript =
      document.getElementById("inventoryApiScript");

    if (oldScript) {
      oldScript.remove();
    }

  }, 15000);

}

// =========================
// NEW STOCK FORM
// =========================

function showNewStockForm() {

  document.getElementById("message").innerHTML =
    '<p class="success">✅ BOTH IMEIs scanned successfully!</p>' +
    '<p>Please enter the stock details below.</p>';

  document.getElementById("scannedCode").innerHTML =

    "<strong>IMEI 1:</strong> " +
    scannedIMEIs[0] +

    "<br><strong>IMEI 2:</strong> " +
    scannedIMEIs[1] +

    '<br><br>' +

    '<label><strong>Serial Number:</strong></label>' +
    '<input type="text" id="newSerial" ' +
    'placeholder="Enter Serial Number" ' +
    'style="width:100%;padding:12px;margin:8px 0;">' +

    '<label><strong>Product ID:</strong></label>' +
    '<select id="newProductId" ' +
    'style="width:100%;padding:12px;margin:8px 0;">' +

    '<option value="">Select Product</option>' +
    '<option value="P001">P001 - Samsung A16</option>' +
    '<option value="P002">P002 - Redmi Note 14</option>' +
    '<option value="P003">P003 - Redmi Note 12 Pro 5G</option>' +

    '</select>' +

    '<label><strong>Branch:</strong></label>' +
    '<select id="newBranch" ' +
    'style="width:100%;padding:12px;margin:8px 0;">' +

    '<option value="">Select Branch</option>' +
    '<option value="B01">B01 - BANSALAN</option>' +
    '<option value="B02">B02 - BUHANGIN</option>' +
    '<option value="B03">B03 - CALINAN</option>' +
    '<option value="B04">B04 - CAGAYAN DE ORO</option>' +
    '<option value="B05">B05 - DIGOS</option>' +

    '</select>' +

    '<button onclick="saveNewStockFromPage()" ' +
    'style="width:100%;padding:14px;margin-top:10px;font-size:18px;">' +
    '💾 SAVE NEW STOCK' +
    '</button>';
}
  // =========================
// SAVE NEW STOCK
// =========================

function saveNewStockFromPage() {

  const imei1 = scannedIMEIs[0] || '';
  const imei2 = scannedIMEIs[1] || '';

  const serial =
    document.getElementById("newSerial").value.trim();

  const productId =
    document.getElementById("newProductId").value;

  const branch =
    document.getElementById("newBranch").value;

  if (!serial) {
    alert("Please enter Serial Number.");
    return;
  }

  if (!productId) {
    alert("Please select Product ID.");
    return;
  }

  if (!branch) {
    alert("Please select Branch.");
    return;
  }

  document.getElementById("message").innerHTML =
    '<p class="success">💾 Saving new stock to Google Sheets...</p>';

  const callbackName = "inventorySaveCallback";

  window[callbackName] = function(result) {

    console.log("Save result:", result);

    if (result.success) {

      document.getElementById("message").innerHTML =
        '<p class="success">✅ NEW STOCK SAVED SUCCESSFULLY!</p>';

      document.getElementById("scannedCode").innerHTML =

        "<strong>IMEI 1:</strong> " + imei1 +

        "<br><strong>IMEI 2:</strong> " + imei2 +

        "<br><strong>Serial:</strong> " + serial +

        "<br><strong>Product ID:</strong> " + productId +

        "<br><strong>Branch:</strong> " + branch +

        "<br><br>📦 Added to Inventory.";

    } else {

      document.getElementById("message").innerHTML =
        '<p class="error">❌ SAVE FAILED.</p>' +
        '<p>' + (result.message || "Unknown error.") + '</p>';
    }

    delete window[callbackName];

    const oldScript =
      document.getElementById("saveStockScript");

    if (oldScript) {
      oldScript.remove();
    }
  };

  const appsScriptUrl =
    "https://script.google.com/macros/s/AKfycbylq5dZebjqqWlyUtLdtxuo6068nc3K-qjS_MoiJAggvUZ_WIqsFloMMOZvN7KrNAEF/exec";

  const script =
    document.createElement("script");

  script.id = "saveStockScript";

  script.src =
    appsScriptUrl +
    "?api=save" +
    "&imei1=" + encodeURIComponent(imei1) +
    "&imei2=" + encodeURIComponent(imei2) +
    "&serial=" + encodeURIComponent(serial) +
    "&productId=" + encodeURIComponent(productId) +
    "&branch=" + encodeURIComponent(branch) +
    "&callback=" + encodeURIComponent(callbackName);

  script.onerror = function() {

    document.getElementById("message").innerHTML =
      '<p class="error">❌ Cannot connect to Google Sheets.</p>';

    delete window[callbackName];

    script.remove();
  };

  document.body.appendChild(script);
}
  
  // =========================
  // STOP SCANNER
  // =========================

  async function stopScanner() {

    if (scanner && scanning) {

      try {

        await scanner.stop();

      }

      catch (error) {

        console.log(error);

      }

      scanning = false;

    }

  }
  
</script>

</body>

</html>
